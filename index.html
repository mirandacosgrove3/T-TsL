<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T-TsL">
<meta name="theme-color" content="#5e1535">
<title>T-TsL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--f:"SF Pro Display","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#5e1535;--panel:#2a0816;--panel2:#7a1d45;--line:#b9467a;--edge:#1c0410;--ink:#fff0f5;--dim:#f2bcd2;--accent:#ff2d55;--accent2:#b3121c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"SF Pro Display","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#cvFx{pointer-events:auto;touch-action:none}
/* blocky buttons: square corners, heavy outline, hard offset shadow that collapses on press */
button{font-family:inherit}
#pauseBtn,.cl button,.btn,.seg{border-radius:0}
#pauseBtn{position:fixed;display:none;z-index:5;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font:900 14px/1 var(--f);letter-spacing:2px;box-shadow:3px 3px 0 var(--edge)}
#pauseBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px 18px;gap:12px;z-index:4;touch-action:none}
#pad.mirror{flex-direction:row-reverse}
#pad[hidden]{display:none}
.cl{display:grid;grid-template-columns:repeat(2,66px);gap:10px}
.cl button{height:58px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font:900 22px/1 var(--f);touch-action:none;box-shadow:4px 4px 0 var(--edge)}
.cl button.sm{font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.cl button.wide{grid-column:span 2}
.cl button.on{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge);background:var(--accent2);border-color:var(--accent)}
#ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(94,21,53,.95);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:10;padding:28px 20px;overflow:auto;touch-action:pan-y}
#ov[hidden]{display:none}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card h1{margin:6px 0 0;font-size:46px;letter-spacing:-1px;font-weight:900;text-transform:uppercase;line-height:1}
.card h2{margin:0 0 2px;font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:-.5px}
.sub{margin:0 0 10px;color:var(--dim);font-size:14px;line-height:1.4}
.grp{margin:10px 0 -2px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;color:var(--accent)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 16px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font:800 16px/1 var(--f);letter-spacing:1.2px;text-transform:uppercase;text-align:left;box-shadow:5px 5px 0 var(--edge);transition:transform .05s,box-shadow .05s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--edge)}
.btn span{color:var(--dim);font-weight:700;font-size:12px;letter-spacing:.8px}
.btn.primary{background:var(--accent);border-color:#ff8fb0;color:#fff}
.btn.primary span{color:#ffd9d4}
.btn.quiet{background:transparent;justify-content:center;color:var(--dim);box-shadow:none;border-style:dashed}
.btn.quiet:active{transform:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.stat{background:var(--panel);border:2px solid var(--line);padding:12px;box-shadow:4px 4px 0 var(--edge)}
.stat b{display:block;font-size:22px;margin-top:4px;font-weight:900}
.stat small{color:var(--dim);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.set{background:var(--panel);border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:5px 5px 0 var(--edge)}
.set h3{margin:0;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:800}
.row label{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;margin-bottom:8px}
.row label em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row p,.note{margin:6px 0 0;font-size:12px;color:var(--dim);line-height:1.45}
input[type=range]{width:100%;accent-color:var(--accent);touch-action:pan-x}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);padding:3px;gap:3px;border:2px solid var(--line)}
.seg button{padding:11px;border:0;border-radius:0;background:transparent;color:var(--dim);font:800 13px/1 var(--f);letter-spacing:1.2px;text-transform:uppercase}
.seg button.on{background:var(--accent);color:#fff}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;gap:12px}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.help{font-size:13px;color:var(--dim);line-height:1.55;margin:0}
.help b{color:var(--ink);font-weight:700}
.big{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:2px 0 0;font-variant-numeric:tabular-nums;text-transform:uppercase}
#hx{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="cvBg"></canvas><canvas id="cvBd"></canvas><canvas id="cvFx"></canvas>
<button id="pauseBtn" aria-label="Pause">II</button>
<div id="pad" hidden>
  <div class="cl"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="soft" class="wide">▼</button></div>
  <div class="cl"><button data-k="ccw">↺</button><button data-k="cw">↻</button><button data-k="hold" class="sm">Hold</button><button data-k="hard" class="sm">Drop</button></div>
</div>
<div id="ov" hidden></div>
<script>
"use strict";
// ================= constants =================
const W=10,H=40,VIS=20,TOP=H-VIS;
const TYPES=['I','O','T','S','Z','J','L'];
const COLORS={I:'#ffe0ea',S:'#ff9fc4',J:'#ec5aa6',O:'#ff3b55',L:'#c2185b',T:'#a72f9b',Z:'#7442b8'};
const SHAPES={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const SIZE={I:4,O:4,T:3,S:3,Z:3,J:3,L:3};
const ROT={};
for(const t of TYPES){const s=[SHAPES[t]];for(let r=1;r<4;r++){s.push(t==='O'?SHAPES[t]:s[r-1].map(([x,y])=>[SIZE[t]-1-y,x]))}ROT[t]=s}
const KJ={'0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
const KI={'0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};
const K180=[[0,0],[0,1],[1,0],[-1,0],[0,-1]];
const NAMES=['','Single','Double','Triple','Quad'];
const MODE_NAMES={marathon:'Marathon',sprint:'Sprint 40',ultra:'Ultra',master:'Master',zen:'Zen',still:'Still',countdown:'Countdown',climb:'Climb'};
const MODE_LIST=[['Classic',['marathon','sprint','ultra','master','climb']],['Relax',['zen','still']],['Adventurous',['countdown']]];
const MAX_RESETS=15;

// ================= storage / settings =================
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF={control:'drag',sens:0.85,vsens:1.0,flick:0.9,das:150,arr:30,sdf:20,lock:500,tapSides:true,ghost:true,hand:'right',hStrength:0.8,hMoves:true,liveFlick:true,iosHx:false,clearPause:'off',lv:{marathon:1,sprint:1,ultra:1,master:21,zen:1,still:0,countdown:1,climb:35},endless:false,climb:{end:50,per:10,endless:false,catchup:false}};
let S=Object.assign({},DEF,store.get('tessel.settings',{}));S.lv=Object.assign({},DEF.lv,S.lv||{});S.climb=Object.assign({},DEF.climb,S.climb||{});
let BEST=store.get('tessel.best',{});

// ================= haptics =================
// Each event: [gapMs from previous, intensity 0-1, sharpness 0-1, durationMs (0 = transient tap)]
const HX={
  ui:{p:1,e:[[0,.3,.6,0]]},
  move:{p:1,e:[[0,.22,.95,0]]},
  wall:{p:2,e:[[0,.45,.55,0]]},
  rotate:{p:2,e:[[0,.38,1,0]]},
  kick:{p:3,e:[[0,.5,.85,0],[26,.28,.95,0]]},
  soft:{p:0,e:[[0,.14,.7,0]]},
  lock:{p:3,e:[[0,.32,.25,0]]},
  hold:{p:3,e:[[0,.35,.45,0],[38,.22,.45,0]]},
  c1:{p:6,e:[[0,.55,.5,0]]},
  c2:{p:6,e:[[0,.6,.5,0],[55,.6,.5,0]]},
  c3:{p:6,e:[[0,.65,.5,0],[48,.68,.55,0],[48,.72,.6,0]]},
  c4:{p:7,e:[[0,.75,.4,0],[42,.82,.5,0],[42,.9,.6,0],[42,1,.7,110]]},
  tspin:{p:7,e:[[0,.95,1,0],[65,.95,1,0],[65,.5,.3,90]]},
  b2b:{p:7,e:[[0,.7,.9,0],[30,.7,.9,0]]},
  allclear:{p:8,e:[[0,.4,.3,60],[60,.6,.4,60],[60,.8,.5,60],[60,1,.6,220]]},
  level:{p:6,e:[[0,.5,.7,0],[80,.7,.8,0]]},
  topout:{p:9,e:[[0,1,.15,160],[180,.6,.15,140],[160,.3,.1,200]]},
};
const Hap=(()=>{
  const ua=navigator.userAgent;
  const isIOS=/iP(hone|ad|od)/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const native=()=>window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.tesselHaptics;
  const vib=typeof navigator.vibrate==='function'&&!isIOS;
  let sw=null,swLabel=null;
  if(isIOS){try{sw=document.createElement('input');sw.type='checkbox';sw.setAttribute('switch','');sw.id='hxs';swLabel=document.createElement('label');swLabel.htmlFor='hxs';swLabel.id='hx';swLabel.appendChild(sw);document.body.appendChild(swLabel)}catch(e){sw=null}}
  let lastT=0,lastP=-1,lastKind={},log=[];
  function backend(){return native()?'native':vib?'vibrate':isIOS?'ios-web':'none'}
  function play(name,scale){
    const k=HX[name];if(!k||S.hStrength<=0)return;
    if((name==='move'||name==='soft')&&!S.hMoves)return;
    const now=performance.now();
    // priority gate: within 30ms, a weaker event can't stomp a stronger one
    if(now-lastT<30&&k.p<lastP)return;
    if(lastKind[name]&&now-lastKind[name]<(k.p<=1?18:0))return;
    lastT=now;lastP=k.p;lastKind[name]=now;
    const sc=S.hStrength*(scale==null?1:scale);
    let t=0;const ev=k.e.map(([gap,i,s,d])=>{t+=gap;return{t,i:Math.min(1,i*sc),s,d}});
    log.push(name);if(log.length>50)log.shift();
    const n=native();
    if(n){try{n.postMessage({events:ev})}catch(e){}return}
    if(vib){// no strength control on the web: approximate strength with pulse length
      const pat=[];let cur=0;
      for(const e of ev){const on=e.d?Math.round(e.d*e.i):Math.round(6+e.i*24);if(pat.length){pat.push(Math.max(0,e.t-cur))}pat.push(on);cur=e.t+on}
      try{navigator.vibrate(pat)}catch(e){}return}
    if(sw&&S.iosHx){// single fixed-strength tick per event; only works on iOS 17.4–26.4
      for(const e of ev){if(e.i<0.3&&ev.length===1&&k.p<2)continue;if(e.t===0)swLabel.click();else setTimeout(()=>swLabel.click(),e.t)}}
  }
  return{play,backend,get log(){return log}};
})();
const hap=Hap.play;

// ================= game =================
let g=null,state='menu',afterSettings='menu',updReady=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(mode,lv){
  if(lv==null)lv=S.lv[mode];if(mode==='still')lv=0;if(mode==='zen'&&lv<1)lv=1;
  const cl=S.climb;
  g={mode,start:lv,endless:(mode==='marathon'&&S.endless)||(mode==='climb'&&cl.endless),per:cl.per,end:Math.max(lv,cl.end),catchup:cl.catchup,cd:pickCd(),areT:0,board:new Array(W*H).fill(0),bag:[],queue:[],cur:null,hold:null,canHold:true,score:0,lines:0,level:lv,combo:-1,b2b:false,time:0,lockT:0,resets:0,lowest:0,grav:0,lastRot:false,lastKick:0,msgs:[],flash:null,pid:0,pieces:0};
  fillQueue();spawn(takeNext());resetInput();state='play';hideOv();dirty=true;drawBg();save();
}
function pickCd(){return[2,5,8,10][Math.floor(Math.random()*4)]}
function fillQueue(){while(g.queue.length<7){if(!g.bag.length)g.bag=shuffle(TYPES.slice());g.queue.push(g.bag.pop())}}
function takeNext(){const t=g.queue.shift();fillQueue();return t}
function fits(t,r,x,y){const sh=ROT[t][r],b=g.board;for(let i=0;i<4;i++){const X=x+sh[i][0],Y=y+sh[i][1];if(X<0||X>=W||Y>=H)return false;if(Y>=0&&b[Y*W+X])return false}return true}
function grounded(){const c=g.cur;return!!c&&!fits(c.t,c.r,c.x,c.y+1)}
function spawn(t){
  const c={t,r:0,x:3,y:TOP-1-(t==='I'?1:0)};g.pid++;g.lastRot=false;g.lockT=0;g.resets=0;g.grav=0;dirty=true;
  if(!fits(c.t,c.r,c.x,c.y)){g.cur=null;topOut();return}
  if(fits(c.t,c.r,c.x,c.y+1))c.y++;
  if(gravMs(g.level)<1)while(fits(c.t,c.r,c.x,c.y+1))c.y++;
  g.cur=c;g.lowest=c.y;
}
function topOut(){
  if(g.mode==='zen'||g.mode==='still'){g.board.fill(0);g.score=0;msg('Fresh board');g.combo=-1;g.b2b=false;hap('lock');spawn(takeNext());return}
  hap('topout');endGame(false);
}
function lockReset(wg){if((wg||grounded())&&g.resets<MAX_RESETS){g.lockT=0;g.resets++}}
function newLow(){const c=g.cur;if(c.y>g.lowest){g.lowest=c.y;g.resets=0;g.lockT=0}}
function tryMove(dx,dy){
  const c=g.cur;if(!c)return false;
  if(!fits(c.t,c.r,c.x+dx,c.y+dy))return false;
  const wg=dx?grounded():false;
  c.x+=dx;c.y+=dy;g.lastRot=false;
  if(dy>0)newLow();else lockReset(wg);
  return true;
}
function tryRotate(dir){
  const c=g.cur;if(!c)return false;
  if(c.t==='O'){hap('rotate',.6);return false}
  const to=(c.r+(dir===2?2:dir===1?1:3))%4;
  const kicks=dir===2?K180:(c.t==='I'?KI:KJ)[c.r+'>'+to];
  const wg=grounded();
  for(let i=0;i<kicks.length;i++){
    const kx=kicks[i][0],ky=kicks[i][1];
    if(fits(c.t,to,c.x+kx,c.y-ky)){
      c.x+=kx;c.y-=ky;c.r=to;g.lastRot=true;g.lastKick=i;
      if(c.y>g.lowest)newLow();else lockReset(wg);
      hap(i?'kick':'rotate');return true;
    }
  }
  hap('wall',.6);return false;
}
function softStep(){if(tryMove(0,1)){g.score+=1;return true}return false}
function hardDrop(){
  const c=g.cur;if(!c)return;let n=0;
  while(fits(c.t,c.r,c.x,c.y+1)){c.y++;n++}
  if(n)g.lastRot=false;g.score+=2*n;g.dropFx={x:c.x,t:c.t,r:c.r,y:c.y,n,t0:g.time};
  lock(0.55+0.45*Math.min(1,n/14));
}
function doHold(){
  if(!g.cur||!g.canHold){hap('wall',.5);return}
  const t=g.cur.t,nt=g.hold||takeNext();g.hold=t;g.canHold=false;hap('hold');spawn(nt);
}
function tspin(c){
  if(c.t!=='T'||!g.lastRot)return 0;
  const occ=([dx,dy])=>{const x=c.x+dx,y=c.y+dy;return x<0||x>=W||y>=H||(y>=0&&!!g.board[y*W+x])};
  const n=[[0,0],[2,0],[0,2],[2,2]].filter(occ).length;if(n<3)return 0;
  const front=[[[0,0],[2,0]],[[2,0],[2,2]],[[0,2],[2,2]],[[0,0],[0,2]]][c.r].filter(occ).length;
  return(front===2||g.lastKick===4)?2:1;
}
function findFull(){
  const full=[];
  for(let y=TOP-4;y<H;y++){let f=true;for(let x=0;x<W;x++)if(!g.board[y*W+x]){f=false;break}if(f)full.push(y)}
  return full;
}
function collapse(full){
  // shift rows down in place (no array reallocation)
  const b=g.board;let k=full.length-1,dst=H-1;
  for(let y=H-1;y>=0;y--){if(k>=0&&full[k]===y){k--;continue}if(dst!==y)for(let x=0;x<W;x++)b[dst*W+x]=b[y*W+x];dst--}
  for(;dst>=0;dst--)for(let x=0;x<W;x++)b[dst*W+x]=0;
  dirty=true;
}
function clearFull(){const f=findFull();if(f.length)collapse(f);return f}
function afterClear(){
  if(g.mode==='countdown'){g.cd--;if(g.cd<=0){g.cd=pickCd();if(!countdownDrop()){hap('topout');endGame(false);return}}}
  spawn(takeNext());
}
function countdownDrop(){
  const x=Math.floor(Math.random()*W);let top=H;
  for(let y=0;y<H;y++)if(g.board[y*W+x]){top=y;break}
  for(let y=top-4;y<top;y++)if(y>=0)g.board[y*W+x]='I';
  dirty=true;msg('Incoming I');hap('kick',1.6);
  if(top-4<TOP)return false;
  const f=clearFull();if(f.length){g.lines+=f.length;g.flash={rows:f.map(y=>y-TOP),t:g.time}}
  return true;
}
function msg(text){g.msgs.push({text,t:g.time})}
function lock(dropStrength){
  const c=g.cur;const ts=tspin(c);let above=true;
  for(const[cx,cy]of ROT[c.t][c.r]){const x=c.x+cx,y=c.y+cy;if(y>=0)g.board[y*W+x]=c.t;if(y>=TOP)above=false}
  g.cur=null;g.pieces++;dirty=true;
  if(above){topOut();return}
  const full=findFull();
  const n=full.length,lv=Math.max(1,g.level);let pts=0,label=[],diff=false,wasB2B=false,ac=false;
  if(ts){pts=(ts===2?[400,800,1200,1600]:[100,200,400,400])[n]*lv;label.push((ts===2?'T-Spin':'Mini T-Spin')+(n?' '+NAMES[n]:''));diff=n>0}
  else if(n){pts=[0,100,300,500,800][n]*lv;label.push(NAMES[n]);diff=n===4}
  if(n){
    if(diff&&g.b2b){pts=Math.floor(pts*1.5);label.unshift('B2B');wasB2B=true}
    g.b2b=diff;g.combo++;
    if(g.combo>0){pts+=50*g.combo*lv;label.push('Combo '+g.combo)}
    if(g.board.every((v,i)=>!v||full.includes((i/W)|0))){pts+=[0,800,1200,1800,2000][n]*lv;label.push('All Clear');ac=true}
  }else g.combo=-1;
  // haptics: the biggest thing that happened wins, extras layer on
  if(ac)hap('allclear');
  else if(ts===2&&n)hap('tspin');

function press(k){

// drag / tap / flick
let gest=null;
const cvFx=document.getElementById('cvFx');

function reanchor(G,x,y,t){G.pid=g.cur?g.pid:-1;G.x0=x;G.y0=y;G.t0=t;G.hacc=0;G.vacc=0;G.moved=false;G.wall=false;G.hist=[[t,x,y]];G.carried=true}

  while(G.hacc<=-hs){G.hacc+=hs;if(tryMove(-1,0)){G.moved=true;G.wall=false;hap('move')}else{G.hacc=Math.max(G.hacc,0);if(!G.wall){G.wall=true;hap('wall')}}}

function endGest(e,cancel){

  const t=e.timeStamp||performance.now(),x=e.clientX,y=e.clientY;
  G.hist.push([t,x,y]);

// ================= update =================
function update(dt){
  g.time+=dt;
  const lim=g.mode==='ultra'?180000:g.mode==='countdown'?300000:0;
  if(lim&&g.time>=lim){g.time=lim;endGame(true);return}
  if(lastDir)dasT+=dt;
  if(!g.cur){if(g.areT>0){g.areT-=dt;if(g.areT<=0){g.areT=0;if(g.pending){collapse(g.pending);g.pending=null}afterClear()}}if(!g.cur||state!=='play')return}
  if(lastDir){
    if(dasT>=S.das){
      const d=lastDir==='left'?-1:1;let moved=false,blocked=false;
      if(S.arr<=0){while(tryMove(d,0))moved=true;blocked=true}
      else{arrT+=dt;while(arrT>=S.arr){arrT-=S.arr;if(tryMove(d,0))moved=true;else{arrT=0;blocked=true;break}}}
      if(blocked&&!wallHit){wallHit=true;hap('wall')}else if(moved&&!blocked)wallHit=false;
    }
  }
  if(!g.cur)return;
  const gi=gravMs(g.level);
  let iv=gi,soft=false;
  if(held.soft){const sv=S.sdf>=41?0:(isFinite(gi)?gi:1000)/S.sdf;if(sv<iv){iv=sv;soft=true}}
  if(iv<1){if(soft)while(softStep());else while(tryMove(0,1));}
  else if(isFinite(iv)){
    g.grav+=dt;let steps=0;
    while(g.grav>=iv&&steps<44){
      g.grav-=iv;steps++;
      const ok=soft?softStep():tryMove(0,1);
      if(!ok){g.grav=0;break}
    }
  }
  if(!g.cur)return;
  if(grounded()){
    if(isFinite(gi)||held.soft){g.lockT+=dt;if(g.lockT>=lockMs(g.level))lock()}
  }else g.lockT=0;
}

    let k=0;for(let i=0;i<g.msgs.length;i++)if(g.time-g.msgs[i].t<1500)g.msgs[k++]=g.msgs[i];g.msgs.length=k;
    xf.font=`900 ${Math.max(13,cell*0.7)}px ${FONT}`;xf.fillStyle='#fff1ef';
    const show=g.msgs.slice(-2);
    show.forEach((m,i)=>{const age=g.time-m.t;xf.globalAlpha=Math.min(1,(1500-age)/400);xf.fillText(m.text,bx+bw/2,by+bh*0.36-age/1500*cell*0.8-(show.length-1-i)*cell*1.1)});
    xf.globalAlpha=1;
  }
  if(g.hint&&S.control==='drag'&&state==='play'){
    xf.fillStyle='rgba(42,8,22,0.92)';xf.fillRect(bx+cell*0.5,by+bh*0.55,bw-cell,cell*4.2);xf.strokeStyle='#b9467a';xf.lineWidth=2;xf.strokeRect(bx+cell*0.5,by+bh*0.55,bw-cell,cell*4.2);
    xf.fillStyle='#ffe3e0';xf.font=`600 ${Math.max(11,cell*0.48)}px ${FONT}`;
    ['Drag sideways · move','Tap left / right · rotate','Drag down · soft drop','Flick down · drop   Flick up · hold   (no need to lift)'].forEach((t,i)=>xf.fillText(t,bx+bw/2,by+bh*0.55+cell*(0.95+i*0.95)));
  }
  fxWasClear=false;
}
// ================= loop =================
let last=performance.now(),perf={n:0,sum:0,max:0};
function frame(now){
  const dt=Math.min(now-last,100);last=now;
  if(state==='play'&&g)update(dt);
  const t0=performance.now();
  if(dirty)drawBoard();
  if(g||!fxWasClear)drawFx();
  const ft=performance.now()-t0;perf.n++;perf.sum+=ft;perf.max=Math.max(perf.max,ft);
  pauseBtn.style.display=state==='play'?'block':'none';
  requestAnimationFrame(frame);
}

// ================= overlays =================
const ov=document.getElementById('ov');
function hideOv(){ov.hidden=true;ov.innerHTML=''}
function showOv(html){ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0}
const LOGO=`<svg width="56" height="56" viewBox="0 0 56 56"><rect x="5" y="31" width="22" height="22" fill="#000"/><rect x="31" y="31" width="22" height="22" fill="#000"/><rect x="31" y="5" width="22" height="22" fill="#000"/><rect x="2" y="28" width="22" height="22" fill="${COLORS.O}"/><rect x="28" y="28" width="22" height="22" fill="${COLORS.T}"/><rect x="28" y="2" width="22" height="22" fill="${COLORS.I}"/></svg>`;
function bestLabel(m){const b=BEST[m];if(b==null)return'';return m==='sprint'?'best '+fmtTime(b):(m==='zen'||m==='still'||m==='master'||m==='climb')?'best '+b+' lines':'best '+fmtNum(b)}
function showMenu(){
  if(updReady){location.reload();return}
  state='menu';g=null;resetInput();drawBg();dirty=true;
  const saved=store.get('tessel.save',null);
  showOv(`<div class="card">${LOGO}<h1>T-TsL</h1><p class="sub">Stack. Clear. Repeat.</p>

  ${MODE_LIST.map(([grp,ms])=>`<p class="grp">${grp}</p>`+ms.map(m=>`<button class="btn" data-a="setup-${m}">${MODE_NAMES[m]}<span>${m==='still'?'no gravity':m==='climb'?lvShort(S.lv.climb)+' → '+lvShort(Math.max(S.lv.climb,S.climb.end)):lvShort(S.lv[m])}${bestLabel(m)?' · '+bestLabel(m):''}</span></button>`).join('')).join('')}
  <button class="btn quiet" data-a="settings">Controls, haptics & settings</button></div>`);
}
const MODE_NOTE={marathon:'150 lines, speeding up every 10. Past Lv 20 it climbs into the Master curve (M1–M30).',sprint:'Clear 40 lines as fast as you can. Speed stays fixed.',ultra:'Score as much as you can in 3 minutes. Speed stays fixed.',master:'20G the whole way. Every 10 lines the lock delay and line-clear pause shrink, through M30.',zen:'No game over: topping out wipes the field and score and you keep going. Pick any speed, Lv 1 through M30; it stays fixed.',still:'No gravity, no lock timer, no game over. Pieces sit until you drop them, so you can plan every placement.',climb:'Pick where you start and where you top out. Every level lasts the same number of lines, so no long flat stretch and no sprint at the end.',countdown:'5 minutes. Every few pieces, an I piece drops straight down a random column.'};
function speedNote(v){return v>20?`Instant drop. Lock delay ${Math.round(masterLock(v-20))} ms (Master table). Line-clear pause ${Math.round(clearMs(v))} ms${S.clearPause==='off'?' (off in settings)':''}.`:v<=0?'Pieces only fall when you drop them.':`Lock delay ${S.lock} ms (change it in settings). No line-clear pause.`}
function climbSummary(){const c=S.climb,st=S.lv.climb,en=Math.max(st,c.end);const n=en-st+1;
  if(c.catchup){return `Effect pacing: ${st*c.per} lines at ${lvShort(st)}, then ${c.per} lines per level up to ${lvShort(en)}. ${c.endless?'Then endless.':(en*c.per)+' lines total.'}`}
  return `${n} level${n>1?'s':''} × ${c.per} lines = ${n*c.per} lines${c.endless?', then endless at '+lvShort(en):''}.`}
function showClimbSetup(){
  const c=S.climb;if(c.end<S.lv.climb)c.end=S.lv.climb;
  showOv(`<div class="card"><h2>Climb</h2><p class="sub">${MODE_NOTE.climb}</p>
  <div class="set"><h3>Route</h3>
  <div class="row"><label>Start<em id="v-cst">${lvLabel(S.lv.climb)}</em></label><input type="range" id="cst" min="1" max="50" step="1" value="${S.lv.climb}"></div>
  <div class="row"><label>Top<em id="v-cen">${lvLabel(c.end)}</em></label><input type="range" id="cen" min="1" max="50" step="1" value="${c.end}"></div>
  <div class="row"><label>Lines per level<em id="v-cpr">${c.per}</em></label><input type="range" id="cpr" min="5" max="40" step="5" value="${c.per}"></div>
  <label class="tog">Endless once you reach the top<input type="checkbox" id="cel" ${c.endless?'checked':''}></label>
  <label class="tog">Effect-style pacing (stay at start until caught up)<input type="checkbox" id="ccu" ${c.catchup?'checked':''}></label>
  <p class="note" id="csum">${climbSummary()}</p></div>
  <button class="btn primary" data-a="new-climb">Start</button><button class="btn quiet" data-a="menu">Back</button></div>`);
  const $=id=>document.getElementById(id);
  const sync=()=>{S.lv.climb=+$('cst').value;if(+$('cen').value<S.lv.climb)$('cen').value=S.lv.climb;c.end=+$('cen').value;c.per=+$('cpr').value;c.endless=$('cel').checked;c.catchup=$('ccu').checked;
    $('v-cst').textContent=lvLabel(S.lv.climb);$('v-cen').textContent=lvLabel(c.end);$('v-cpr').textContent=c.per;$('csum').textContent=climbSummary();saveSettings()};
  ['cst','cen','cpr'].forEach(id=>$(id).addEventListener('input',()=>{sync();hap('move')}));
  ['cel','ccu'].forEach(id=>$(id).addEventListener('change',()=>{sync();hap('ui')}));
}
function showSetup(m){
  if(m==='climb'){showClimbSetup();return}
  if(m==='still'){showOv(`<div class="card"><h2>Still</h2><p class="sub">${MODE_NOTE.still}</p><button class="btn primary" data-a="new-still">Start</button><button class="btn quiet" data-a="menu">Back</button></div>`);return}
  const min=m==='master'?21:1,v=Math.max(min,S.lv[m]);S.lv[m]=v;
  showOv(`<div class="card"><h2>${MODE_NAMES[m]}</h2><p class="sub">${MODE_NOTE[m]}</p>
  <div class="set"><h3>${m==='marathon'?'Starting speed':'Speed'}</h3><p class="big" id="lvBig">${lvLabel(v)}</p>
  <input type="range" id="lvIn" min="${min}" max="50" step="1" value="${v}">
  <p class="note" id="lvNote">${speedNote(v)}</p>
  ${m==='marathon'?`<label class="tog">Endless (no 150-line finish)<input type="checkbox" id="t-endless" ${S.endless?'checked':''}></label>`:''}</div>
  <button class="btn primary" data-a="new-${m}">Start</button><button class="btn quiet" data-a="menu">Back</button></div>`);
  const inp=document.getElementById('lvIn');
  inp.addEventListener('input',()=>{S.lv[m]=+inp.value;document.getElementById('lvBig').textContent=lvLabel(+inp.value);document.getElementById('lvNote').textContent=speedNote(+inp.value);saveSettings();hap('move')});
  const en=document.getElementById('t-endless');if(en)en.addEventListener('change',()=>{S.endless=en.checked;saveSettings();hap('ui')});
}
function pauseGame(){if(state!=='play')return;state='pause';resetInput();save();
  showOv(`<div class="card"><h2>Paused</h2><p class="sub">${MODE_NAMES[g.mode]} · ${lvShort(g.level)}</p>
  <button class="btn primary" data-a="resume">Resume</button>
  <button class="btn" data-a="menu">Main menu<span>saves your game</span></button></div>`)}
function resume(){if(!g)return;state='play';resetInput();last=performance.now();hideOv();drawBg();dirty=true}
function endGame(win){
  state='over';resetInput();store.del('tessel.save');
  const m=g.mode;let isBest=false;
  if(m==='sprint'&&win){if(BEST.sprint==null||g.time<BEST.sprint){BEST.sprint=Math.round(g.time);isBest=true}}
  if(m==='marathon'){if(BEST.marathon==null||g.score>BEST.marathon){BEST.marathon=g.score;isBest=g.score>0}}
  if(m==='zen'||m==='still'||m==='master'||m==='climb'){if(BEST[m]==null||g.lines>BEST[m]){BEST[m]=g.lines;isBest=g.lines>0}}
  if(m==='ultra'||m==='countdown'){if(BEST[m]==null||g.score>BEST[m]){BEST[m]=g.score;isBest=g.score>0}}
  store.set('tessel.best',BEST);
  const st=m==='sprint'?[['Time',win?fmtTime(g.time):'—'],['Pieces',g.pieces],['Lines',g.lines],['Pieces/sec',(g.pieces/Math.max(1,g.time/1000)).toFixed(2)]]
    :(m==='master'||m==='climb')?[['Reached',lvShort(g.level)],['Lines',g.lines],['Time',fmtTime(g.time)],['Score',fmtNum(g.score)]]
    :[['Score',fmtNum(g.score)],['Lines',g.lines],['Level',lvShort(g.level)],['Pieces',g.pieces]];
  if(win)hap('allclear');
  setTimeout(()=>showOv(`<div class="card"><h2>${win?(m==='ultra'||m==='countdown'?'Time':m==='master'?'Master cleared':m==='climb'?'Summit':'Finished'):'Topped out'}</h2><p class="sub">${MODE_NAMES[m]} · ${lvShort(g.start)}${isBest?' · new best':''}</p>
  <div class="stats">${st.map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
  <button class="btn primary" data-a="again">Play again</button>
  <button class="btn quiet" data-a="menu">Main menu</button></div>`),350);
}
let lastSave=0;
function maybeSave(){const n=performance.now();if(n-lastSave>5000){lastSave=n;save()}}
function save(){if(!g||state==='over')return;const{msgs,flash,hint,dropFx,...rest}=g;store.set('tessel.save',rest)}
function continueGame(){
  const s=store.get('tessel.save',null);if(!s){showMenu();return}
  g=Object.assign({msgs:[],flash:null,start:s.level||1},s);
  if(g.pending){collapse(g.pending);g.pending=null;g.areT=0}
  if(!g.cur){g.canHold=true;spawn(takeNext())}
  resume();
}
function slider(id,label,min,max,step,val,fmt,note){
  return`<div class="row"><label>${label}<em id="v-${id}">${fmt(val)}</em></label><input type="range" id="s-${id}" min="${min}" max="${max}" step="${step}" value="${val}">${note?`<p>${note}</p>`:''}</div>`}
const FMT={sens:v=>Math.round(v*100)+'% of a column',vsens:v=>Math.round(v*100)+'% of a row',flick:v=>(+v).toFixed(2),das:v=>v+' ms',arr:v=>+v===0?'instant':v+' ms',sdf:v=>+v>=41?'instant':v+'×',lock:v=>v+' ms',hStrength:v=>+v===0?'off':Math.round(v*100)+'%'};
function hapNote(){
  const b=Hap.backend();
  if(b==='native')return'Native haptics: full strength and texture.';
  if(b==='vibrate')return'Android vibration: web pages can’t set strength, so stronger events buzz longer instead.';
  if(b==='ios-web')return'iPhone: Apple blocks web haptics on iOS 26.5 and later. On older iOS you’ll feel one fixed-strength tick per event. Full haptics need the native app version.';
  return'No haptics on this device.';
}
function showSettings(from){
  afterSettings=from;
  const dragOn=S.control==='drag';
  showOv(`<div class="card"><h2>Settings</h2>
  <div class="seg"><button data-c="drag" class="${dragOn?'on':''}">Drag & tap</button><button data-c="buttons" class="${dragOn?'':'on'}">Buttons</button></div>
  ${dragOn?`<p class="help"><b>Drag</b> sideways to move. <b>Tap</b> the left or right half to rotate that way. <b>Drag down</b> to soft drop. <b>Flick down</b> to drop, <b>flick up</b> to hold.</p>
  <div class="set"><h3>Feel</h3>
  ${slider('sens','Drag distance per column',0.4,1.6,0.05,S.sens,FMT.sens,'Lower means a shorter drag moves the piece further.')}
  ${slider('vsens','Drag distance per row (down)',0.5,2,0.05,S.vsens,FMT.vsens)}
  ${slider('flick','Flick speed needed',0.4,2,0.05,S.flick,FMT.flick,'Raise this if you get drops you didn’t mean.')}
  <label class="tog">Rotate direction by tap side<input type="checkbox" id="t-tapSides" ${S.tapSides?'checked':''}></label>
  <label class="tog">Flick works without lifting<input type="checkbox" id="t-liveFlick" ${S.liveFlick?'checked':''}></label></div>`
  :`<div class="set"><h3>Movement</h3>
  ${slider('das','Delay before sliding (DAS)',0,300,5,S.das,FMT.das,'How long you hold ◀ ▶ before the piece starts sliding.')}
  ${slider('arr','Slide speed (ARR)',0,100,1,S.arr,FMT.arr,'Time between steps while sliding. 0 snaps to the wall.')}
  ${slider('sdf','Soft drop speed',5,41,1,S.sdf,FMT.sdf)}
  <label class="tog">Left-handed layout<input type="checkbox" id="t-hand" ${S.hand==='left'?'checked':''}></label></div>`}
  <div class="set"><h3>Timing</h3>
  ${slider('lock','Lock delay',100,1000,10,S.lock,FMT.lock,'How long a piece can sit on the stack before it locks. Standard is 500 ms. Applies to Lv speeds; M speeds use the Master table.')}
  <div class="row"><label>Line-clear pause at M speeds</label><div class="seg" style="grid-template-columns:repeat(3,1fr)">${['off','half','full'].map(v=>`<button data-cp="${v}" class="${S.clearPause===v?'on':''}">${v==='off'?'Off':v==='half'?'Half':'Full'}</button>`).join('')}</div><p>Full matches the Master table (up to 500 ms at M1). Off keeps play continuous.</p></div></div>
  <div class="set"><h3>Haptics</h3>
  ${slider('hStrength','Strength',0,1,0.05,S.hStrength,FMT.hStrength)}
  <label class="tog">Tick on every move & soft drop<input type="checkbox" id="t-hMoves" ${S.hMoves?'checked':''}></label>
  ${Hap.backend()==='ios-web'?`<label class="tog">Try iPhone web haptics (iOS 26.4 or older)<input type="checkbox" id="t-iosHx" ${S.iosHx?'checked':''}></label>`:''}
  <p class="note">${hapNote()}</p></div>
  <div class="set"><h3>Display</h3>
  <label class="tog">Landing preview<input type="checkbox" id="t-ghost" ${S.ghost?'checked':''}></label></div>
  <button class="btn quiet" data-a="reset-settings">Reset to defaults</button>
  <button class="btn primary" data-a="settings-done">Done</button></div>`);
  ov.querySelectorAll('input[type=range]').forEach(inp=>{const id=inp.id.slice(2);inp.addEventListener('input',()=>{S[id]=+inp.value;document.getElementById('v-'+id).textContent=FMT[id](inp.value);saveSettings();if(id==='hStrength')hap('c2')})});
  ov.querySelectorAll('input[type=checkbox]').forEach(inp=>{const id=inp.id.slice(2);inp.addEventListener('change',()=>{if(id==='hand')S.hand=inp.checked?'left':'right';else S[id]=inp.checked;saveSettings();layout();hap('ui')})});
  ov.querySelectorAll('[data-cp]').forEach(b=>b.addEventListener('click',()=>{S.clearPause=b.dataset.cp;saveSettings();showSettings(afterSettings)}));
  ov.querySelectorAll('.seg button[data-c]').forEach(b=>b.addEventListener('click',()=>{S.control=b.dataset.c;saveSettings();layout();showSettings(afterSettings)}));
}
function saveSettings(){store.set('tessel.settings',S)}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;hap('ui');
  if(a.startsWith('setup-')){showSetup(a.slice(6));return}
  if(a.startsWith('new-')){newGame(a.slice(4));g.hint=!store.get('tessel.seenHint',false)&&S.control==='drag';store.set('tessel.seenHint',true);layout();return}
  if(a==='again'){newGame(g.mode,g.start);layout();return}
  if(a==='continue')continueGame();
  else if(a==='resume')resume();
  else if(a==='restart')newGame(g.mode,g.start);
  else if(a==='menu'){if(g&&state!=='over')save();showMenu()}
  else if(a==='settings')showSettings(state==='pause'?'pause':'menu');
  else if(a==='reset-settings'){S=JSON.parse(JSON.stringify(DEF));saveSettings();layout();showSettings(afterSettings)}
  else if(a==='settings-done'){layout();if(afterSettings==='pause'){state='play';pauseGame()}else showMenu()}
});
pauseBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')pauseGame();else save()}});
addEventListener('pagehide',()=>save());

window.__t={masterLock,masterClear,lockMs,gravMs,get g(){return g},get state(){return state},press,release,get L(){return L},newGame,lock,fits,perf,Hap,levelInterval};
layout();showMenu();requestAnimationFrame(frame);
const BUILD='20261103144849';
function applyUpdate(){updReady=true;if(state==='menu'||state==='over')location.reload()}
async function checkForUpdate(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).v;if(!v||v===BUILD)return;
    // pull the new files straight into the offline cache, then swap in at the menu
    const keys=await caches.keys();
    for(const k of keys){const c=await caches.open(k);
      await Promise.all(['./','./index.html','./sw.js','./manifest.webmanifest'].map(u=>fetch(u+(u.includes('?')?'&':'?')+'fresh='+Date.now(),{cache:'no-store'}).then(res=>{if(res.ok)return c.put(u,res)}).catch(()=>{})))}
    applyUpdate();
  }catch(e){}
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='ttsl-updated')applyUpdate()});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)applyUpdate()});
  setTimeout(checkForUpdate,800);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
}catch(e){}}
